[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recall-assistant"
version = "0.1.0"
description = "Question answering over public NHTSA vehicle recall data"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "psycopg[binary]>=3.1",
    "psycopg_pool>=3.1",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "sentence-transformers>=3.0",
    "transformers>=4.40",
    "tqdm>=4.66",
    "openai>=3.29,<4",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "httpx2>=2.12",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that need Postgres (deselect with '-m \"not integration\"')",
    "slow: tests that download model files or run heavy computation",
]
